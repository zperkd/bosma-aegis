name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: Marketplace / HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: pip install aiohttp cryptography
      - run: python tests/test_logic.py
      - run: python tests/test_control.py

  integration-tests:
    name: Home Assistant lifecycle and config flows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant==2026.11.1
      - run: pytest -q tests/ha --asyncio-mode=auto -p no:respx -o asyncio_default_fixture_loop_scope=function
        env:
          PYTHONPATH: .
